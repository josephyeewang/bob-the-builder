# Generated by workflow.mjs. Do not edit by hand: change workflow.mjs and run `node workflow.mjs`.
name: outside-check
on:
  schedule:
    - cron: '17 * * * *'
permissions: {}
concurrency:
  group: outside-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    outputs:
      ran: ${{ steps.collect.outputs.ran }}
      failed: ${{ steps.collect.outputs.failed }}
    env:
      PRODUCTS: ${{ secrets.PRODUCTS }}
      CHECK_TOKEN: ${{ secrets.CHECK_TOKEN }}
      RESULTS: results.txt
    steps:
      - name: get the check code
        run: git init -q src && git -C src fetch -q --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA" && git -C src checkout -q FETCH_HEAD
      - name: product 1 / heartbeat
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs heartbeat 1
      - name: product 1 / audit-files
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs audit-files 1
      - name: product 1 / audit-run
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs audit-run 1
      - name: product 1 / deploys
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs deploys 1
      - name: product 1 / permissions
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs permissions 1
      - name: product 1 / robot-merges
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs robot-merges 1
      - name: product 2 / heartbeat
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs heartbeat 2
      - name: product 2 / audit-files
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs audit-files 2
      - name: product 2 / audit-run
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs audit-run 2
      - name: product 2 / deploys
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs deploys 2
      - name: product 2 / permissions
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs permissions 2
      - name: product 2 / robot-merges
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs robot-merges 2
      - name: product 3 / heartbeat
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs heartbeat 3
      - name: product 3 / audit-files
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs audit-files 3
      - name: product 3 / audit-run
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs audit-run 3
      - name: product 3 / deploys
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs deploys 3
      - name: product 3 / permissions
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs permissions 3
      - name: product 3 / robot-merges
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs robot-merges 3
      - name: product 1 / repo-guard
        if: ${{ !cancelled() }}
        run: node src/outside-check.mjs repo-guard 1
      - name: collect
        id: collect
        if: ${{ always() }}
        run: node src/collect.mjs
  notify:
    needs: check
    if: ${{ always() && needs.check.outputs.ran != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RAN: ${{ needs.check.outputs.ran }}
      FAILED: ${{ needs.check.outputs.failed }}
    steps:
      - name: get the notify code
        run: git init -q src && git -C src fetch -q --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA" && git -C src checkout -q FETCH_HEAD
      - name: one issue per failing check
        run: node src/notify.mjs
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: get the keep-alive code
        run: git init -q src && git -C src fetch -q --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA" && git -C src checkout -q FETCH_HEAD
      - name: commit if quiet for 50 days
        run: node src/keep-alive.mjs
