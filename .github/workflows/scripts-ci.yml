name: scripts-ci

# Supply chain backstop per Bob v2.13 audit finding F5. Bob's scripts/
# and SKILL.md reach every user via `update bob`, so any compromise of
# main propagates instantly. This workflow is the mechanical baseline
# under the maintainer-discipline trust model documented in SECURITY.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh scripts/blueprint/*.sh

  failure-mode-index:
    name: failure-mode index is consistent
    runs-on: ubuntu-latest
    # Rule 33 (v2.40) — Bob runs its own checks on ITSELF, not only in scaffolded downstream
    # projects. This is the first one that does. It earned its keep on its first run: against
    # an index written minutes earlier it caught five cited fixtures that did not exist and a
    # hand-written scoreboard wrong on three of four lines — claim-without-artifact and
    # stale-register-counts, both committed by the author of the catalogue while writing it.
    steps:
      - uses: actions/checkout@v4
      - name: Check fixture citations and re-count the scoreboard
        run: bash scripts/failure-mode-check.sh

  bob-self-check:
    name: Bob's own docs pass Bob's checks
    runs-on: ubuntu-latest
    # Rule 33 — the coherence sweep on Bob itself. Until 2026-10-28 it could not read Bob's
    # heading-style decision log and reported "no drift" over three duplicate decision IDs.
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity (the self-tests make commits in temp repos)
        run: |
          git config --global user.name "Bob CI"
          git config --global user.email "ci@example.com"
      - name: Coherence sweep over the Bob repo
        run: bash scripts/coherence-check.sh .
      - name: Regression tests for Bob's checkers
        run: bash scripts/selftest-gate-scripts.sh
      - name: Blueprint checks prove their planted cases (D-029)
        run: bash scripts/blueprint/selftest-blueprint.sh
      - name: ORCHESTRATE's tests (no dependencies, Node's own test runner)
        run: node --test $(find orchestrate -name '*.test.mjs')
      - name: Each kind of content still has one home (D-032)
        run: node scripts/one-home-check.mjs
      - name: The lens count in audit-lenses/README.md matches the lens files
        run: |
          files=$(ls audit-lenses/L[0-9][0-9]-*.md | grep -vc stack-checklists)
          stated=$(grep -oE '^## The [0-9]+ bands and [0-9]+ lenses' audit-lenses/README.md | grep -oE '[0-9]+ lenses' | grep -oE '[0-9]+')
          echo "lens files: $files · README says: $stated"
          test "$files" = "$stated" || { echo "audit-lenses/README.md states $stated lenses but there are $files lens files"; exit 1; }
      - name: CHANGELOG.md has an entry for the current version (D-027)
        run: |
          ver=$(grep -oE '^v[0-9]+(\.[0-9]+)+$' VERSION | head -1 || true)
          echo "version: $ver"
          test -n "$ver" || { echo "VERSION must hold one line like v2.50 (D-032)"; exit 1; }
          grep -qE "^\*?${ver//./\\.}[:  —]" CHANGELOG.md || { echo "CHANGELOG.md has no entry starting with $ver"; exit 1; }
      - name: No template is copied back into build-protocol.md (D-027)
        run: |
          for t in "Phase Report Template:## Phase \[N\] Report" "Cowork Session:## SESSION \[N\]" "Behavioral Core:# \[Product Name\] — Behavioral Core" "Decision Log:### D-XXX: \["; do
            pat="${t#*:}"
            if grep -qE "^$pat" build-protocol.md; then echo "build-protocol.md contains a copy of the ${t%%:*} template; it lives only in templates/"; exit 1; fi
          done

  bob-init-smoke:
    name: bob-init smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity (CI needs user.name + user.email)
        run: |
          git config --global user.name "Bob CI"
          git config --global user.email "ci@example.com"
      - name: Run bob-init.sh in a temp directory
        run: |
          TMP=$(mktemp -d)
          cd "$TMP"
          bash "$GITHUB_WORKSPACE/scripts/bob-init.sh" ci-smoke
          # Assert all expected scaffold artifacts exist.
          for f in ci-smoke/CLAUDE.md \
                   ci-smoke/AGENTS.md \
                   ci-smoke/.claude/settings.json \
                   ci-smoke/.gitignore \
                   ci-smoke/.env.example \
                   ci-smoke/README.md \
                   ci-smoke/.git/HEAD; do
            test -e "$f" || { echo "MISSING: $f"; exit 1; }
          done
          # Assert the initial commit landed.
          cd ci-smoke
          test "$(git rev-list --count HEAD)" -ge 1 || { echo "no initial commit"; exit 1; }
          echo "✓ scaffold + initial commit OK"

  bob-doctor-smoke:
    name: bob-doctor smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate a healthy install layout
        run: |
          mkdir -p "$HOME/.claude/skills"
          ln -s "$GITHUB_WORKSPACE/skill" "$HOME/.claude/skills/bob"
      - name: Run bob-doctor.sh
        run: bash scripts/bob-doctor.sh
